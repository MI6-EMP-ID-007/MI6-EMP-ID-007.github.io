name: Casinocademy Website
title: casinocademy.com
description: Casinocademy teaches online casino players how it all works, with plain-English guides to games, bonuses, deposit methods and casinos.
url: "https://casinocademy.com"
baseurl: ""
lang: en
locale: en_GB
excerpt_separator: <!--more-->
plugins:
  - jekyll-redirect-from
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
paginate: 4
paginate_path: "/page:num/"
exclude:
  - issues.md
defaults:
  - scope:
      path: ""
    values:
      # Share image for Open Graph / Twitter cards (jekyll-seo-tag only reads it per page, so it is set here as a default).
      # A page or post can override it with its own `image:` in front matter.
      image:
        path: /images/CasinocademyShare.png
        alt: Casinocademy graduation cap logo
