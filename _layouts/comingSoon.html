<html lang="{{ site.lang | default: 'en' }}">
	<head>
		<title>{{ page.title }} | {{ site.title }}</title>
		{% include head.html %}  
	</head>
	<body class="single">

		<!-- Wrapper -->
			<div id="wrapper">

				{% include header.html %}

				<!-- Main -->
					<div id="main">

						<!-- Post -->
							<article class="post">
								<header>
									<div class="title">
										<h2>{{ page.title }}</h2>
										<p>{{ page.subtitle | strip }}</p>
									</div>
								</header>
								<span class="image featured"><img src="{{'images/comingSoon.jpg' | relative_url}}" alt="The words Coming Soon written in chalk on a green blackboard" /></span>
								{{ content }}
							</article>

					</div>

				<!-- Footer -->
					
					{% include footer.html %}

			</div>
	</body>
</html>
