<article class="mini-post">
    <header>
		<h3><a href="{{ post.url }}">{{post.title}}</a></h3>
		<!-- Post Date Stamp -->
		<time class="published" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
		<!-- Author Img -->
		{% assign author_data = site.data.authors | where: "name", post.author | first %}
		{% assign authorImg = '/images/' | append: author_data.photo %}
		<a href="{{ post.url }}" class="author"><img src="{{ authorImg | relative_url}}" alt="{{ post.author }}" loading="lazy"></a>
	</header>
	{% assign headerImg = 'images/' | append:post.headerImg %}
	<a href="{{ post.url }}" class="image">
	<img src="{{headerImg | relative_url}}" alt="{{post.title}}" loading="lazy"></a>
</article>
