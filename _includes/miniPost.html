<article class="mini-post">
    <header>
		<h3><a href="{{ post.url }}">{{post.title}}</a></h3>
		<!-- Post Date Stamp -->
		<time class="published" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
		<!-- Author Img -->
		{% assign authorImg = 'images/Authors/' | append:post.author | append:".jpg" %}
		<a href="{{ post.url }}" class="author"><img src="{{ authorImg | relative_url}}" alt="{{ post.author }}"></a>
	</header>
	{% assign headerImg = 'images/' | append:post.headerImg %}
	<a href="{{ post.url }}" class="image">
	<img src="{{headerImg | relative_url}}" alt="{{post.title}}"></a>
</article>
